<!DOCTYPE html>

<html>

<head>

<meta charset="utf-8">

<title>Lottery AI</title>


<style>

body{

font-family:Arial;
background:#f4f6fa;

}


.container{

display:flex;
gap:20px;
padding:20px;

}


.box{

background:white;
padding:20px;
border-radius:12px;
flex:1;

}


.card{

background:#eee;
padding:8px;
margin:5px;
border-radius:6px;

}


button{

background:#4CAF50;
color:white;
padding:10px;
border:0;
width:100%;

}
.number-grid{

display:grid;

grid-template-columns:repeat(10,50px);

gap:10px;

margin:20px 0;

}


.number-item{

display:flex;

align-items:center;

justify-content:center;

background:#f1f3f8;

padding:8px;

border-radius:8px;

cursor:pointer;

}


.number-item input{

width:18px;

height:18px;

margin-right:5px;

}
</style>


</head>


<body>


<h2>

</nav>

</body>


</html>
